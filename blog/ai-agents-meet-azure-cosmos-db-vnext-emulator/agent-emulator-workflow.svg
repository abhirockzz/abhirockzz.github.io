<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">How the agent gets from intent to verified data</title>
  <desc id="desc">A light vertical sequence uses distinct role colors for developer intent, coding agent reasoning, Agent Skill procedure, Cosmos DB Shell execution, and vNext emulator data.</desc>
  <rect x="1" y="1" width="1198" height="598" rx="18" fill="#F8FAFC" stroke="#B8C6D6" stroke-width="2"/>

  <g transform="translate(0 -120)">
  <line x1="105" y1="190" x2="105" y2="702" stroke="#CBD5E1" stroke-width="4"/>

  <g>
    <circle cx="105" cy="203" r="23" fill="#64748B"/>
    <text x="105" y="210" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">01</text>
    <rect x="145" y="158" width="990" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="180" y="190" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64748B">INTENT</text>
    <text x="180" y="225" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#172B4D">Developer</text>
    <text x="465" y="204" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172B4D">Describe the outcome</text>
    <text x="465" y="231" font-family="Aptos, Segoe UI, sans-serif" font-size="18" fill="#475569">Request realistic test data, not shell steps.</text>
  </g>

  <g>
    <circle cx="105" cy="311" r="23" fill="#8B5CF6"/>
    <text x="105" y="318" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">02</text>
    <rect x="145" y="266" width="990" height="90" rx="10" fill="#FAF7FF" stroke="#A78BFA" stroke-width="2"/>
    <text x="180" y="298" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#6D28D9">REASONING</text>
    <text x="180" y="333" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#172B4D">Coding agent</text>
    <text x="465" y="312" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172B4D">Plan and adapt</text>
    <text x="465" y="339" font-family="Aptos, Segoe UI, sans-serif" font-size="18" fill="#5B3A75">Translate intent into actions and react to output.</text>
  </g>

  <g>
    <circle cx="105" cy="419" r="26" fill="#16A34A"/>
    <text x="105" y="426" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">03</text>
    <rect x="145" y="370" width="990" height="98" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="3"/>
    <text x="180" y="403" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#15803D">PROCEDURE</text>
    <text x="180" y="441" font-family="Avenir Next, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#172B4D">Agent Skill</text>
    <text x="465" y="416" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172B4D">Supply the operating procedure</text>
    <text x="465" y="445" font-family="Menlo, Consolas, monospace" font-size="16" fill="#166534">discover  /  choose  /  safeguard  /  verify</text>
  </g>

  <g>
    <circle cx="105" cy="527" r="23" fill="#F97316"/>
    <text x="105" y="534" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">04</text>
    <rect x="145" y="482" width="990" height="90" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="180" y="514" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C2410C">EXECUTION</text>
    <text x="180" y="549" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#172B4D">Cosmos DB Shell</text>
    <text x="465" y="528" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172B4D">Run explicit commands</text>
    <text x="465" y="555" font-family="Menlo, Consolas, monospace" font-size="16" fill="#9A3412">$ create  $ load  $ query</text>
  </g>

  <g>
    <circle cx="105" cy="635" r="23" fill="#0EA5E9"/>
    <text x="105" y="642" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">05</text>
    <rect x="145" y="590" width="990" height="90" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
    <text x="180" y="622" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0369A1">LOCAL DATA</text>
    <text x="180" y="657" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#172B4D">vNext emulator</text>
    <text x="465" y="636" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#172B4D">Persist resources and data</text>
    <text x="465" y="663" font-family="Aptos, Segoe UI, sans-serif" font-size="18" fill="#075985">Keep the workflow local, fast, and inspectable.</text>
  </g>
  </g>

</svg>